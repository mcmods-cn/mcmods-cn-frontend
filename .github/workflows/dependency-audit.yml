name: Dependency vulnerability audit

on:
  push:
  pull_request:
  schedule:
    - cron: "37 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up the lockfile audit runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Scan the committed npm lockfile
        id: npm_audit
        continue-on-error: true
        run: |
          mkdir -p security-reports
          npm audit --audit-level=high --json > security-reports/npm-audit.json

      - name: Archive npm audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: security-reports/npm-audit.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce vulnerability gate
        if: always() && steps.npm_audit.outcome != 'success'
        run: exit 1
