name: Frontend checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: python3 scripts/test-audit-ledger.py -v
      - run: npm run check
      # Includes actual TypeScript locale parsing and interpolation parity.
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
